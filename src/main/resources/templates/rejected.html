<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rejected Contracts</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-success"><div class="container"><a class="navbar-brand" th:href="@{/}">DAT CMS</a><a class="btn btn-outline-light btn-sm" th:href="@{/}">Dashboard</a></div></nav><div class="container py-4"><h2>Rejected Contracts</h2><p class="text-secondary">Records are retained for audit history.</p><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Contract No.</th><th>Description</th><th>Department</th><th>Status</th></tr></thead><tbody><tr th:each="c:${contracts}"><td th:text="${c.contract_no}"></td><td th:text="${c.description}"></td><td th:text="${c.dept_name}"></td><td th:text="${c.status_name}"></td></tr><tr th:if="${#lists.isEmpty(contracts)}"><td colspan="4" class="text-center p-4">No rejected contracts.</td></tr></tbody></table></div></div></div></body></html>
