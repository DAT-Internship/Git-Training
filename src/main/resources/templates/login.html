<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAT CMS Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container min-vh-100 d-flex align-items-center justify-content-center"><div class="card shadow-sm p-4" style="width:100%;max-width:420px"><h3>DAT CMS</h3><p class="text-secondary">Contract Management System</p><div class="alert alert-danger" th:if="${param.error}">Username or password is incorrect.</div><div class="alert alert-success" th:if="${param.logout}">Logged out.</div><form method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" name="password" type="password" required></div><button class="btn btn-success w-100">Login</button></form></div></div></body></html>
