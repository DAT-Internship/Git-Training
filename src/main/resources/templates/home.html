<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAT CMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-success"><div class="container-fluid"><a class="navbar-brand" th:href="@{/}">DAT CMS</a><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-light btn-sm">Logout</button></form></div></nav><main class="container py-4"><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="d-flex justify-content-between mb-3"><div><h2>Contract Dashboard</h2><p class="text-secondary">Register and track contracts.</p></div><div class="d-flex gap-2"><a class="btn btn-success" th:href="@{/contracts/new}">+ New Contract</a><a class="btn btn-primary" th:href="@{/approvals}">My Approval List</a><a class="btn btn-outline-secondary" th:href="@{/rejected}">Rejected</a></div></div><div class="card"><div class="table-responsive"><table class="table table-hover mb-0"><thead class="table-light"><tr><th>ID</th><th>Contract No.</th><th>Description</th><th>Party</th><th>Department</th><th>Value</th><th>Status</th><th>Stage</th><th></th></tr></thead><tbody><tr th:each="c:${contracts}"><td th:text="${c.contract_id}"></td><td th:text="${c.contract_no}"></td><td th:text="${c.description}"></td><td th:text="${c.party_name}"></td><td th:text="${c.dept_name}"></td><td th:text="${c.contract_value}"></td><td th:text="${c.status_name}"></td><td th:text="${c.stage_name != null ? c.stage_name : '-'}"></td><td><form th:if="${c.status_name == 'Draft'}" th:action="@{/contracts/{id}/submit(id=${c.contract_id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-success">Submit</button></form></td></tr><tr th:if="${#lists.isEmpty(contracts)}"><td colspan="9" class="text-center p-4">No contracts yet.</td></tr></tbody></table></div></div></main></body></html>
