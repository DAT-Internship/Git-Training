<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approvals</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-success"><div class="container-fluid"><a class="navbar-brand" th:href="@{/}">DAT CMS</a><a class="btn btn-outline-light btn-sm" th:href="@{/}">Dashboard</a></div></nav><div class="container py-4"><h2>My Approval List</h2><p>Role: <strong th:text="${roleCode}"></strong></p><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Contract</th><th>Description</th><th>Party</th><th>Department</th><th>Value</th><th>Stage</th><th>Action</th></tr></thead><tbody><tr th:each="c:${pending}"><td th:text="${c.contract_no}"></td><td th:text="${c.description}"></td><td th:text="${c.party_name}"></td><td th:text="${c.dept_name}"></td><td th:text="${c.contract_value}"></td><td th:text="${c.stage_name}"></td><td style="min-width:250px"><form class="mb-2" th:action="@{/approvals/{id}/approve(id=${c.contract_id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input class="form-control form-control-sm mb-2" name="comments" placeholder="Optional comment"><button class="btn btn-success btn-sm w-100">Approve & Next Stage</button></form><form th:action="@{/approvals/{id}/reject(id=${c.contract_id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><textarea class="form-control form-control-sm mb-2" name="reason" required placeholder="Rejection reason"></textarea><button class="btn btn-danger btn-sm w-100">Reject</button></form></td></tr><tr th:if="${#lists.isEmpty(pending)}"><td colspan="7" class="text-center p-4">No contracts waiting for your approval.</td></tr></tbody></table></div></div></div></body></html>
