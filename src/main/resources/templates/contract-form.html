<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register Contract</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-success"><div class="container"><a class="navbar-brand" th:href="@{/}">DAT CMS</a></div></nav><div class="container py-4" style="max-width:850px"><div class="card"><div class="card-body p-4"><h2>Register Contract</h2><p class="text-secondary">Save as Draft, then submit for approval.</p><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/contracts}" th:object="${form}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Contract Number *</label><input class="form-control" th:field="*{contractNo}" required></div><div class="col-md-6"><label class="form-label">Contract Value *</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{contractValue}" required></div><div class="col-12"><label class="form-label">Description *</label><textarea class="form-control" th:field="*{description}" required></textarea></div><div class="col-md-6"><label class="form-label">Department</label><select class="form-select" th:field="*{departmentId}" required><option value="">Select</option><option th:each="d:${departments}" th:value="${d.department_id}" th:text="${d.dept_name}"></option></select></div><div class="col-md-6"><label class="form-label">Customer/Supplier</label><select class="form-select" th:field="*{partyId}" required><option value="">Select</option><option th:each="p:${parties}" th:value="${p.party_id}" th:text="${p.party_name}"></option></select></div><div class="col-md-6"><label class="form-label">Category</label><select class="form-select" th:field="*{categoryId}" required><option value="">Select</option><option th:each="c:${categories}" th:value="${c.category_id}" th:text="${c.name}"></option></select></div><div class="col-md-6"><label class="form-label">Contract Type</label><select class="form-select" th:field="*{contractTypeId}" required><option value="">Select</option><option th:each="t:${types}" th:value="${t.contract_type_id}" th:text="${t.name}"></option></select></div><div class="col-md-6"><label class="form-label">Currency</label><select class="form-select" th:field="*{currencyId}" required><option value="">Select</option><option th:each="c:${currencies}" th:value="${c.currency_id}" th:text="${c.code+' - '+c.name}"></option></select></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-success">Save Draft</button><a class="btn btn-outline-secondary" th:href="@{/}">Cancel</a></div></form></div></div></div></body></html>
